---
# --- Pacman configuration ---

- name: Enable Color in pacman.conf
  lineinfile:
    path: /etc/pacman.conf
    regexp: "^#?Color"
    line: "Color"

- name: Enable ParallelDownloads in pacman.conf
  lineinfile:
    path: /etc/pacman.conf
    regexp: "^#?ParallelDownloads"
    line: "ParallelDownloads = 10"

- name: Enable multilib repository
  replace:
    path: /etc/pacman.conf
    regexp: '#\[multilib\]\n#Include = /etc/pacman.d/mirrorlist'
    replace: '[multilib]\nInclude = /etc/pacman.d/mirrorlist'

- name: Update pacman database after config changes
  pacman:
    update_cache: true

# --- zram ---

- name: Install zram-generator
  pacman:
    name: zram-generator
    state: present

- name: Configure zram
  copy:
    content: |
      [zram0]
      zram-size = ram / 2
      compression-algorithm = zstd
    dest: /etc/systemd/zram-generator.conf

# --- Fonts ---

- name: Install fonts
  pacman:
    name:
      - inter-font
      - noto-fonts
      - noto-fonts-emoji
      - ttf-jetbrains-mono-nerd
    state: present

- name: Configure fontconfig for macOS-like rendering
  copy:
    content: |
      <?xml version="1.0"?>
      <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
      <fontconfig>
        <!-- Antialiasing -->
        <match target="font">
          <edit name="antialias" mode="assign"><bool>true</bool></edit>
        </match>

        <!-- Hinting -->
        <match target="font">
          <edit name="hinting" mode="assign"><bool>true</bool></edit>
          <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
        </match>

        <!-- Subpixel rendering -->
        <match target="font">
          <edit name="rgba" mode="assign"><const>rgb</const></edit>
          <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
        </match>

        <!-- Default sans-serif -->
        <alias>
          <family>sans-serif</family>
          <prefer><family>Inter</family></prefer>
        </alias>

        <!-- Default monospace -->
        <alias>
          <family>monospace</family>
          <prefer><family>JetBrains Mono Nerd Font</family></prefer>
        </alias>
      </fontconfig>
    dest: /etc/fonts/local.conf

# --- Common tools ---

- name: Install common tools
  pacman:
    name:
      - git
      - curl
      - wget
      - htop
      - btop
      - bash-completion
      - gvfs
      - gvfs-smb
      - ntfs-3g
      - xdg-user-dirs
      - xdg-utils
      - jq
      - tree
      - vim
      - kitty
      - rofi
      - atuin
      - restic
      - nfs-utils
      - openssh
      - man-db
      - man-pages
      - rsync
      - fastfetch
    state: present

- name: Enable SSH server
  systemd:
    name: sshd.service
    enabled: true

# --- Applications ---

- name: Install applications
  pacman:
    name:
      - libreoffice-fresh
      - celluloid
      - file-roller
      - p7zip
      - unzip
      - zip
    state: present

# --- Dev tools (pacman) ---

- name: Install dev tools from official repos
  pacman:
    name:
      - aws-cli-v2
      - uv
      - bun
      - docker
      - docker-compose
    state: present

- name: Mount /data/docker
  mount:
    path: /data/docker
    src: "{{ data_device }}"
    fstype: btrfs
    opts: subvol=@docker,noatime,ssd,space_cache=v2
    state: mounted
  when: data_device | default('none') != 'none'

- name: Mount /data/volumes
  mount:
    path: /data/volumes
    src: "{{ data_device }}"
    fstype: btrfs
    opts: subvol=@volumes,noatime,ssd,space_cache=v2,compress=zstd
    state: mounted
  when: data_device | default('none') != 'none'

- name: Mount /data/vms
  mount:
    path: /data/vms
    src: "{{ data_device }}"
    fstype: btrfs
    opts: subvol=@vms,noatime,ssd,nodatacow
    state: mounted
  when: data_device | default('none') != 'none'

- name: Mount /data/.snapshots
  mount:
    path: /data/.snapshots
    src: "{{ data_device }}"
    fstype: btrfs
    opts: subvol=@snapshots,noatime,ssd,space_cache=v2,compress=zstd
    state: mounted
  when: data_device | default('none') != 'none'

- name: Add user to docker group
  user:
    name: "{{ username }}"
    groups: docker
    append: true

# --- AUR helper ---

- name: Clone {{ aur_helper }} from AUR
  git:
    repo: "https://aur.archlinux.org/{{ aur_helper }}.git"
    dest: "/tmp/{{ aur_helper }}"
    version: master
  become: true
  become_user: "{{ username }}"
  become_method: su

- name: Install {{ aur_helper }} build dependencies
  pacman:
    name:
      - cargo
    state: present

- name: Build {{ aur_helper }}
  command: makepkg --noconfirm
  args:
    chdir: "/tmp/{{ aur_helper }}"
  become: true
  become_user: "{{ username }}"
  become_method: su

- name: Install {{ aur_helper }} package
  shell: pacman -U --noconfirm /tmp/{{ aur_helper }}/*.pkg.tar.zst

- name: Clean up {{ aur_helper }} build directory
  file:
    path: "/tmp/{{ aur_helper }}"
    state: absent

# --- nvidia-container-toolkit ---

- name: Allow passwordless sudo for AUR installs
  copy:
    content: "{{ username }} ALL=(ALL) NOPASSWD: ALL"
    dest: /etc/sudoers.d/99-temp-aur
    mode: '0440'
  when: nvidia_gpu | default(false)

- name: Install nvidia-container-toolkit via paru
  command: paru -S --noconfirm nvidia-container-toolkit
  become: true
  become_user: "{{ username }}"
  become_method: su
  when: nvidia_gpu | default(false)

- name: Remove temporary passwordless sudo
  file:
    path: /etc/sudoers.d/99-temp-aur
    state: absent
  when: nvidia_gpu | default(false)

# --- Docker configuration ---

- name: Configure Docker daemon
  copy:
    content: "{{ _config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
  vars:
    _base:
      data-root: /data/docker
      dns:
        - "192.168.2.106"
      dns-opts:
        - "ndots:0"
      log-driver: json-file
      log-opts:
        max-size: "100m"
        max-file: "3"
    _nvidia:
      runtimes:
        nvidia:
          args: []
          path: nvidia-container-runtime
    _config: "{{ _base | combine(_nvidia if (nvidia_gpu | default(false)) else {}) }}"
  when: data_device | default('none') != 'none'

- name: Enable Docker service
  systemd:
    name: docker.service
    enabled: true

# --- Claude Code ---

- name: Install Claude Code
  command: bash -c "curl -fsSL https://claude.ai/install.sh | bash"
  become: true
  become_user: "{{ username }}"
  become_method: su

# --- Flatpak ---

- name: Install flatpak
  pacman:
    name: flatpak
    state: present

- name: Add Flathub remote
  command: >
    flatpak remote-add --if-not-exists flathub
    https://dl.flathub.org/repo/flathub.flatpakrepo

- name: Install Flatpak applications
  command: "flatpak install --system --noninteractive flathub {{ item }}"
  loop:
    - app.zen_browser.zen
    - com.bitwarden.desktop
    - md.obsidian.Obsidian
    - org.telegram.desktop
    - org.zulip.Zulip
    - org.localsend.localsend_app
